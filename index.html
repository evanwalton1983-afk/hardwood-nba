<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hardwood</title>
<meta name="description" content="Hardwood: NBA game lines, ratings, price shopping and bet tracking.">
<meta name="theme-color" content="#1f1813">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hardwood">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#1f1813; --plank:#2a211a; --plank2:#33281f; --seam:#46382b; --seam2:#5a4a3a;
  --chalk:#f1e7d8; --dim:#b9a893; --faint:#8a7a68;
  --amber:#f0a630; --amber-ink:#2a1a05; --paint:#7aaee0; --brick:#e06a55;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:6px; --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--floor);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--paint)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num,.tab-n{font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond);letter-spacing:.01em}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(31,24,19,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--seam);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.mark{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.mark svg{width:22px;height:22px;align-self:center}
.mark small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--faint);letter-spacing:0}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.status{font-size:12px;color:var(--dim);text-align:right;line-height:1.25}
.status b{color:var(--chalk);font-weight:600}

/* Buttons */
.btn{border:1px solid var(--seam2);background:var(--plank2);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;font-size:14px;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--seam2);background:var(--plank2);border-radius:var(--r-sm);width:36px;height:36px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
main{max-width:1100px;margin:0 auto;padding:14px 16px 24px}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.01em;margin:0}
h2{font-size:24px;line-height:1.1}
h3{font-size:18px;line-height:1.15}
.sub{color:var(--dim);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.section{margin:18px 0}
.panel{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r);padding:14px}
.note{border-left:3px solid var(--paint);background:var(--plank);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--dim);font-size:14px}
.note.warn{border-left-color:var(--amber)}
.note.bad{border-left-color:var(--brick)}
.note b{color:var(--chalk)}
.empty{padding:28px 16px;text-align:center;color:var(--dim)}
.empty h3{color:var(--chalk);margin-bottom:6px}

/* Day strip */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--seam);background:var(--plank);border-radius:var(--r-sm);padding:6px 12px;text-align:left;min-width:84px}
.day b{display:block;font-family:var(--cond);font-size:17px;font-weight:600}
.day span{font-size:12px;color:var(--dim)}
.day[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}

/* Game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.game{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r);padding:12px 14px 12px;text-align:left;width:100%;display:block}
.game:hover{border-color:var(--seam2)}
.g-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:8px;gap:8px}
.g-head .live{color:var(--amber);font-weight:600}
.tier{font-family:var(--cond);font-weight:700;font-size:13px;border:1px solid var(--seam2);border-radius:4px;padding:0 6px;color:var(--dim)}
.tier.A{color:var(--amber);border-color:var(--amber)}
.team-line{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:10px;padding:2px 0}
.team-name{font-family:var(--cond);font-weight:600;font-size:21px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.team-name small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--faint);margin-left:6px}
.team-proj{font-family:var(--cond);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);min-width:36px;text-align:right}
.team-pct{font-family:var(--cond);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.team-line.fav .team-pct{color:var(--amber)}
.badges{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
.badge{font-family:var(--body);font-size:11px;font-weight:600;border-radius:4px;padding:1px 5px;background:var(--plank2);border:1px solid var(--seam2);color:var(--dim)}
.badge.hot{color:var(--amber);border-color:rgba(240,166,48,.5)}
.badge.bad{color:var(--brick);border-color:rgba(224,106,85,.5)}

/* The lane: signature probability bar */
.lane{position:relative;height:14px;margin:10px 0 6px;border-radius:3px;background:var(--plank2);border:1px solid var(--seam2);overflow:hidden}
.lane .fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,rgba(240,166,48,.92) 0 18px,rgba(226,150,38,.92) 18px 19px)}
.lane .mid{position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;background:var(--floor);transform:translateX(-1px)}
.lane .circle{position:absolute;left:50%;top:50%;width:26px;height:26px;border:2px solid var(--floor);border-radius:50%;transform:translate(-50%,-50%);opacity:.55}
.lane .tick{position:absolute;top:-2px;bottom:-2px;width:3px;transform:translateX(-1.5px)}
.lane .tick.m{background:var(--paint)}
.lane .tick.k{background:var(--chalk)}
.lane-key{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
.lane-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--seam);gap:10px;font-size:13px}
.g-foot .lines{color:var(--dim)}
.g-foot .lines b{color:var(--chalk);font-weight:600}
.pick{font-weight:600;color:var(--amber);text-align:right}
.pick.none{color:var(--faint);font-weight:500}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--seam);border-radius:var(--r);background:var(--plank)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--seam)}
th{font-family:var(--cond);font-weight:600;font-size:14px;color:var(--dim);background:var(--plank2);position:sticky;top:0}
th[data-sort]{cursor:pointer}
th[data-sort][aria-sort]{color:var(--chalk)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
td:first-child{background:var(--plank)}
tbody tr:hover td{background:var(--plank2)}
tbody tr:last-child td{border-bottom:0}
td.pos{color:var(--amber);font-weight:600}
td.neg{color:var(--brick)}
td.muted,span.muted{color:var(--faint)}
tr.click{cursor:pointer}

/* Sheet (game detail, modals) */
.scrim{position:fixed;inset:0;background:rgba(10,7,5,.6);z-index:40;display:none}
.scrim.open{display:block}
.sheet{visibility:hidden;position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--floor);border-top:1px solid var(--seam2);border-radius:14px 14px 0 0;padding:0 16px calc(24px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease-out,visibility 0s linear .22s;max-width:860px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease-out}
.sheet-head{position:sticky;top:0;background:var(--floor);padding:14px 0 10px;display:flex;align-items:flex-start;gap:10px;z-index:2;border-bottom:1px solid var(--seam)}
.sheet-head h2{font-size:26px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--seam2);margin:8px auto 0}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin svg{animation:none}}

/* Board */
.board td:first-child{font-weight:600}
.side-cell{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bet-cell .muted{font-size:13px}
.board .book{font-size:12px;color:var(--faint);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r-sm);padding:8px 10px}
.kv span{display:block;font-size:12px;color:var(--dim)}
.kv b{font-family:var(--cond);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.inj{list-style:none;margin:0;padding:0}
.inj li{display:flex;gap:8px;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--seam);font-size:14px}
.inj li:last-child{border-bottom:0}
.inj .st{font-weight:600}
.inj .st.out{color:var(--brick)}
.inj .st.q{color:var(--amber)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--dim);font-weight:500}
.field .hint{font-size:12px;color:var(--faint)}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{background:var(--plank2);border:1px solid var(--seam2);border-radius:var(--r-sm);padding:9px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--amber)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(31,24,19,.97);border-top:1px solid var(--seam);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:11px;font-weight:600}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--amber)}
@media (min-width:900px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:57px;bottom:auto;border-top:0;border-bottom:1px solid var(--seam);background:var(--floor)}
  nav.tabs .in{max-width:1100px;padding:0 16px;gap:4px;justify-content:flex-start}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:7px;padding:10px 12px;font-size:14px;border-bottom:3px solid transparent}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--amber)}
}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:var(--chalk);color:var(--floor);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px);display:none}
.toast.show{display:block}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r-sm);padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--dim)}
.stat b{font-family:var(--cond);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b.pos{color:var(--amber)}
.stat b.neg{color:var(--brick)}
.stat small{display:block;font-size:12px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--seam2);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:var(--plank);border:0;padding:6px 12px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--plank2);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--amber)}
.prose{max-width:72ch}
.prose p{margin:0 0 10px}
.wr-menu{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:420px){
  .team-name{font-size:19px}
  .games{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#f0a630" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2v20M5 5c3 3 3 11 0 14M19 5c-3 3-3 11 0 14"/></svg>Hardwood<small id="ver"></small></div>
    <div class="top-actions">
      <div class="status" id="status"></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh data and prices" aria-label="Refresh data and prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<main id="app" tabindex="-1"></main>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Hardwood NBA
   Game lines, team ratings, multi book price shopping, bet ledger with
   closing line value, and Send to War Room.
   ===================================================================== */
const VERSION = '1.0.1';
const SOURCE_APP = 'hardwood_nba';
const WAR_ROOM_DEFAULT = 'https://lighthearted-kringle-dafe7e.netlify.app/import/receive';

/* ---------- Model constants (fitted offline, see Season log > Backtest) ----------
   Ridge regularised offense and defense ratings on points, refit every game day.
   Walk forward fit on 2009-10 to 2018-19, checked on 2021-22 to 2025-26.     */
const M = {
  HALF: 30,        // days: half life of the time decay on past games
  LAM: 4,          // ridge strength toward the carried prior, in game units
  CARRY: 0.6,      // share of last season's rating carried into the new season
  DAMP: 20,        // margins beyond 20 points count half
  B2B: 2.0,        // points of margin lost on the second night of a back to back
  HCA0: 2.5,       // home court prior, points
  LAM_HCA: 30,     // ridge strength on home court
  MU0: 105,        // starting points per team prior for the oldest season loaded
  SD_ATS: 13.46,   // sd of actual margin around the closing spread, 2021-22 to 2025-26
  SD_ML: 12.8,     // sd that maps a margin to a win probability (fit to outcomes and no vig moneylines)
  SD_TOT: 17.96,   // sd of actual total around the closing total, 2021-22 to 2025-26
};
const BACKTEST = {
  games: 23579, seasons: '2007-08 to 2025-26 (through Jan 7, 2026)',
  test: { label: '2021-22 to 2025-26', n: 4992, rmseModel: 13.91, rmseMarket: 13.51, wMargin: 0.082, wMarginSe: 0.052, trmseModel: 18.64, trmseMarket: 18.00, wTotal: -0.004 },
  train: { label: '2009-10 to 2018-19', n: 11336, rmseModel: 12.22, rmseMarket: 12.03, wMargin: 0.141, wTotal: 0.139 },
  ats: [['0 to 1', 574, 557], ['1 to 2', 521, 514], ['2 to 3', 453, 400], ['3 to 4', 320, 331], ['4 to 6', 403, 396], ['6 plus', 226, 238]],
  tot: [['0 to 2', 817, 867], ['2 to 4', 715, 732], ['4 to 6', 443, 427], ['6 to 10', 354, 392], ['10 plus', 109, 95]],
  early: [['First 100 games', 13.35, 12.83], ['Games 100 to 250', 12.49, 12.20], ['Games 250 to 500', 12.80, 12.57], ['Games 500 to 900', 12.77, 12.63], ['Games 900 plus', 13.05, 12.61]],
  b2b: { margin: 2.23, unpriced: 0.81, se: 0.18, fade: [['2009-10 to 2014-15', 1148, 1076], ['2015-16 to 2020-21', 967, 924], ['2021-22 to 2025-26', 716, 630]] },
  push: { spreadInt: 0.033, totalInt: 0.021 },
};

/* ---------- Teams (ESPN ids; refreshed from ESPN when reachable) ---------- */
const TEAMS0 = [
  [1,'ATL','Atlanta Hawks','Hawks'],[2,'BOS','Boston Celtics','Celtics'],[17,'BKN','Brooklyn Nets','Nets'],
  [30,'CHA','Charlotte Hornets','Hornets'],[4,'CHI','Chicago Bulls','Bulls'],[5,'CLE','Cleveland Cavaliers','Cavaliers'],
  [6,'DAL','Dallas Mavericks','Mavericks'],[7,'DEN','Denver Nuggets','Nuggets'],[8,'DET','Detroit Pistons','Pistons'],
  [9,'GS','Golden State Warriors','Warriors'],[10,'HOU','Houston Rockets','Rockets'],[11,'IND','Indiana Pacers','Pacers'],
  [12,'LAC','LA Clippers','Clippers'],[13,'LAL','Los Angeles Lakers','Lakers'],[29,'MEM','Memphis Grizzlies','Grizzlies'],
  [14,'MIA','Miami Heat','Heat'],[15,'MIL','Milwaukee Bucks','Bucks'],[16,'MIN','Minnesota Timberwolves','Timberwolves'],
  [3,'NO','New Orleans Pelicans','Pelicans'],[18,'NY','New York Knicks','Knicks'],[25,'OKC','Oklahoma City Thunder','Thunder'],
  [19,'ORL','Orlando Magic','Magic'],[20,'PHI','Philadelphia 76ers','76ers'],[21,'PHX','Phoenix Suns','Suns'],
  [22,'POR','Portland Trail Blazers','Trail Blazers'],[23,'SAC','Sacramento Kings','Kings'],[24,'SA','San Antonio Spurs','Spurs'],
  [28,'TOR','Toronto Raptors','Raptors'],[26,'UTAH','Utah Jazz','Jazz'],[27,'WSH','Washington Wizards','Wizards'],
];
const TEAMS = TEAMS0.map(([id, abbr, name, nick], idx) => ({ id: String(id), abbr, name, nick, idx }));
const TEAM_BY_ID = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const NT = TEAMS.length;
function teamByName(name) {
  if (!name) return null;
  const n = String(name).toLowerCase().trim();
  return TEAMS.find(t => t.name.toLowerCase() === n)
    || TEAMS.find(t => n.endsWith(' ' + t.nick.toLowerCase()) || n === t.nick.toLowerCase())
    || (n.startsWith('los angeles c') ? TEAM_BY_ID['12'] : null);
}

/* ---------- Books ---------- */
const BOOKS = [['draftkings','DraftKings','DK'],['fanduel','FanDuel','FD'],['betmgm','BetMGM','MGM'],['williamhill_us','Caesars','CZR'],
  ['fanatics','Fanatics','FAN'],['betrivers','BetRivers','BR'],['espnbet','ESPN BET','ESPN'],['hardrockbet','Hard Rock Bet','HR'],
  ['ballybet','Bally Bet','BAL'],['betonlineag','BetOnline','BOL'],['lowvig','LowVig','LV'],['bovada','Bovada','BOV'],['mybookieag','MyBookie','MYB'],['betus','BetUS','BUS']];
const bookName = (k, title) => { const b = BOOKS.find(x => x[0] === k); return b ? b[1] : (title || k); };
const bookShort = (k, title) => { const b = BOOKS.find(x => x[0] === k); return b ? b[2] : (title || k || '').slice(0, 6); };

const DEFAULTS = {
  oddsKey: '', regions: 'us', myBooks: ['draftkings','fanduel','betmgm','williamhill_us','fanatics'],
  unit: 10, minEv: 0.03, staleHours: 3, slateDays: 3, wSide: 0.10, wTotal: 0.0,
  autoOddsMin: 60, showPreseason: false, warRoomUrl: WAR_ROOM_DEFAULT,
};

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = x => typeof x === 'number' && isFinite(x);
const pct = (x, d = 0) => fin(x) ? (x * 100).toFixed(d) + '%' : '--';

const DB = (() => {

   Each game gives two rows:

/* =====================================================================

const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const ODDS = 'https://api.the-odds-api.com/v4/sports/basketball_nba/odds/';

async function getJSON(url, { timeout = 15000 } = {}) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; e.headers = r.headers; throw e; }
    return { json: await r.json(), headers: r.headers };

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }));
  return out;
}
const scoreOf = s => s == null ? null : typeof s === 'object' ? (fin(s.value) ? s.value : parseFloat(s.displayValue)) : parseFloat(s);

/* One team's schedule for a season and season type (2 regular, 3 postseason). */
async function fetchTeamSchedule(teamId, season, type) {
  const { json } = await getJSON(`${ESPN}/teams/${teamId}/schedule?season=${season}&seasontype=${type}`);
  const out = [];
  for (const ev of json.events || []) {
    const c = (ev.competitions || [])[0]; if (!c) continue;
    const st = (c.status && c.status.type) || (ev.status && ev.status.type) || {};
    const comps = c.competitors || []; const h = comps.find(x => x.homeAway === 'home'), a = comps.find(x => x.homeAway === 'away');
    if (!h || !a) continue;
    const ht = TEAM_BY_ID[String(h.team && h.team.id || h.id)], at = TEAM_BY_ID[String(a.team && a.team.id || a.id)];
    if (!ht || !at) continue;
    const hp = scoreOf(h.score), ap = scoreOf(a.score);
    out.push({ id: String(ev.id), date: ev.date, ymd: etYMD(ev.date), home: ht.id, away: at.id, neutral: c.neutralSite ? 1 : 0,
      done: !!st.completed && fin(hp) && fin(ap) && hp + ap > 0, hp, ap, type });
  }

}
/* Full season of completed games: every team's schedule, de duplicated by event id. */

  const types = includePost ? [2, 3] : [2];
  const jobs = []; for (const t of TEAMS) for (const ty of types) jobs.push([t.id, ty]);
  let done = 0, fails = 0;
  const parts = await pool(jobs, 6, async ([id, ty]) => {
    try { return await fetchTeamSchedule(id, season, ty); }
    catch (e) { fails++; return []; }
    finally { done++; onProgress && onProgress(done, jobs.length); }
  });
  const map = new Map();
  for (const arr of parts) for (const g of arr) { const old = map.get(g.id); if (!old || (!old.done && g.done)) map.set(g.id, g); }
  const games = [...map.values()].sort((a, b) => a.date < b.date ? -1 : 1);

    if (!h || !a) continue;

function slateGames(ymd) {
  const s = S.slate[ymd]; if (!s) return [];
  return s.games.filter(g => S.settings.showPreseason || g.seasonType !== 1).sort((a, b) => a.date < b.date ? -1 : 1);
}
function dayStrip() {
  return `<div class="days" role="group" aria-label="Game days">${S.days.map(d => {
    const n = slateGames(d).length;
    return `<button class="day" data-day="${d}" aria-pressed="${S.day === d}"><b>${d === today() ? 'Today' : fmtDay(d).split(',')[0]}</b><span>${fmtDay(d).replace(/^\w+,\s*/, '')}, ${n} game${n === 1 ? '' : 's'}</span></button>`;
  }).join('')}</div>`;
}
function viewSlate() {
  const games = slateGames(S.day);
  const R = ratingsFor(S.day);
  const notes = [];
  if (!S.settings.oddsKey) notes.push(`<div class="note warn"><b>No price key yet.</b> Hardwood is using ESPN's single line where it has one. Add your Odds API key in <a href="#" data-tab-link="settings">Settings</a> to shop all your books. One pull costs ${S.settings.regions.split(',').length * 3} credits and covers every game.</div>`);
  const opener = (S.seasons[S.curSeason] ? S.seasons[S.curSeason].games : []).find(g => g.type === 2 && g.ymd >= today());
  if (R.games === 0) notes.push(`<div class="note"><b>The ${seasonLabel(S.curSeason)} season has not started${opener ? `; opening night is ${fmtDay(opener.ymd)}` : ''}.</b> Ratings are last season's, carried at ${Math.round(M.CARRY * 100)}%. Over the first 100 games the model trails the market most (13.35 vs 12.83 points of error in the backtest), and it cannot see offseason roster moves.</div>`);
  else if (R.games < 150) notes.push(`<div class="note"><b>Early season.</b> ${R.games} games played so far. Ratings still lean on last season carried at ${Math.round(M.CARRY * 100)}%, which is when the model trails the market most (13.35 vs 12.83 points of error over the first 100 games in the backtest). Roster changes since last season are invisible to it.</div>`);
  const ex = S.odds && now() - S.odds.t > S.settings.staleHours * 3600e3;
  if (ex) notes.push(`<div class="note warn"><b>Prices are ${fmtAgo(S.odds.t)}.</b> That is past your ${S.settings.staleHours} hour limit, so no plays are flagged. Tap refresh to pull new prices.</div>`);
  const evals = games.map(evalGame);
  const pre = evals.filter(e => !e.started).length;
  const flagged = evals.filter(e => e.pick).length;
  const head = `<div class="row" style="margin-bottom:10px"><div><h2>${S.day === today() ? (games.length ? 'Tonight' : 'Today') : fmtDay(S.day)}</h2>
    <div class="sub">${games.length ? `${games.length} game${games.length === 1 ? '' : 's'}, ${flagged} at or above your ${(S.settings.minEv * 100).toFixed(1)}% EV bar` : 'No games'}</div></div>
    <span class="spacer"></span>${pre ? warRoomButtons() : ''}</div>`;
  let body;
  if (!games.length) {
    const next = S.days.find(d => slateGames(d).length);
    body = `<div class="empty"><h3>No NBA games ${S.day === today() ? 'today' : 'this day'}</h3><p>${next ? `Next games: ${fmtDay(next)}.` : S.settings.showPreseason ? 'Nothing on the schedule in the next few days.' : 'Preseason games are hidden. The regular season slate appears here once it starts, or turn on preseason in Settings.'}</p></div>`;
  } else body = `<div class="games">${evals.map(gameCard).join('')}</div>`;
  return dayStrip() + head + (notes.length ? `<div class="section" style="display:grid;gap:8px;margin-top:0">${notes.join('')}</div>` : '') + body + sentStatus();
}
function gameCard(E) {
  const { g, ht, at } = E;
  const time = E.started ? `<span class="live">${esc(g.detail || (g.done ? 'Final' : 'Live'))}</span>` : fmtTime(g.date) + (g.neutral ? ', neutral site' : '');
  const pA = 1 - E.winFair, pH = E.winFair;
  const badge = (b2b, out, q) => (b2b ? '<span class="badge hot">B2B</span>' : '') + (out ? `<span class="badge bad">${out} out</span>` : '') + (q ? `<span class="badge">${q} questionable</span>` : '');
  const scoreA = E.started && fin(g.ap) ? g.ap : Math.round(E.proj.ap), scoreH = E.started && fin(g.hp) ? g.hp : Math.round(E.proj.hp);
  const tl = (t, rec, b, sc, p, fav) => `<div class="team-line${fav ? ' fav' : ''}"><div class="team-name" title="${esc(t.name)}">${esc(t.nick)}<small>${esc(rec)}</small><span class="badges">${b}</span></div><div class="team-proj" title="${E.started ? 'Score' : 'Model projected points'}">${sc}</div><div class="team-pct">${pct(p)}</div></div>`;
  const tickM = `<span class="tick m" style="left:${(100 * (1 - E.winModel)).toFixed(1)}%" title="Model ${pct(1 - E.winModel)}"></span>`;
  const tickK = fin(E.winMkt) ? `<span class="tick k" style="left:${(100 * (1 - E.winMkt)).toFixed(1)}%" title="Market ${pct(1 - E.winMkt)}"></span>` : '';
  const sp = E.cons.spLine, to = E.cons.toLine;
  const lines = fin(sp) || fin(to) ? `<span class="lines">${fin(sp) ? `<b>${ht.abbr} ${lineStr(sp)}</b>` : ''}${fin(sp) && fin(to) ? ', ' : ''}${fin(to) ? `total <b>${totStr(to)}</b>` : ''}</span>` : `<span class="lines">Model ${ht.abbr} ${lineStr(-Math.round(E.proj.pm * 2) / 2)}, total ${totStr(Math.round(E.proj.pt * 2) / 2)}</span>`;
  let pick;
  if (E.started) pick = `<span class="pick none">${g.done ? 'Final' : 'In progress'}</span>`;
  else if (!Object.keys(E.books).length) pick = `<span class="pick none">No prices yet</span>`;
  else if (E.stale) pick = `<span class="pick none">Prices stale</span>`;
  else if (E.pick) pick = `<span class="pick">${esc(E.pick.label)} ${amStr(E.pick.best.price)} ${bookShort(E.pick.best.book, E.pick.best.bookTitle)}, ${sgnPct(E.pick.best.ev)}</span>`;
  else pick = `<span class="pick none">Best ${E.top ? sgnPct(E.top.best.ev) : '--'}, below your bar</span>`;
  return `<button class="game" data-game="${g.id}" aria-label="${esc(at.name)} at ${esc(ht.name)}">
    <div class="g-head"><span>${time}</span><span class="tier ${E.tier}" title="Read quality: A solid, B something to check, C thin">${E.tier}</span></div>
    ${tl(at, g.arec || teamRecord(at.id), badge(E.b2ba, E.outA, E.qA), scoreA, pA, pA > 0.5)}
    ${tl(ht, g.hrec || teamRecord(ht.id), badge(E.b2bh, E.outH, E.qH), scoreH, pH, pH >= 0.5)}
    <div class="lane" aria-hidden="true"><span class="fill" style="width:${(100 * pA).toFixed(1)}%"></span><span class="mid"></span><span class="circle"></span>${tickM}${tickK}</div>
    <div class="lane-key"><span><i style="background:var(--amber)"></i>Fair win chance</span><span><i style="background:var(--paint)"></i>Model <i style="background:var(--chalk);margin-left:8px"></i>Market</span></div>
    <div class="g-foot">${lines}${pick}</div></button>`;
}

/* ---------- Market ---------- */
function viewMarket() {
  const games = S.days.flatMap(d => slateGames(d)).map(evalGame);
  if (!games.length) return dayStrip() + `<div class="empty"><h3>No games in the next ${S.settings.slateDays} days</h3><p>The market table fills in as soon as games are scheduled.</p></div>`;
  const rows = games.map(E => ({
    E, time: Date.parse(E.g.date), sp: E.cons.spLine, mm: -E.proj.pm, gap: fin(E.cons.M) ? E.proj.pm - E.cons.M : null,
    to: E.cons.toLine, mt: E.proj.pt, tgap: fin(E.cons.T) ? E.proj.pt - E.cons.T : null, ev: E.top && !E.started ? E.top.best.ev : null,
  }));
  const k = S.mkSort.k, d = S.mkSort.d;
  const val = r => k === 'gap' ? Math.abs(r.gap ?? -1) : k === 'tgap' ? Math.abs(r.tgap ?? -1) : r[k] ?? -1e9;
  rows.sort((a, b) => (val(a) - val(b)) * d);
  const th = (key, label, title) => `<th data-sort="${key}" ${k === key ? `aria-sort="${d > 0 ? 'ascending' : 'descending'}"` : ''} title="${esc(title || '')}">${label}</th>`;
  return `<div class="row" style="margin-bottom:10px"><div><h2>Market</h2><div class="sub">Every game in the next ${S.settings.slateDays} days. Sort by gap to see where the model disagrees most; that is a reading list, not a bet list.</div></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Game</th>${th('time', 'Tip')}${th('sp', 'Spread', 'Consensus home line')}${th('mm', 'Model', 'Model home line')}${th('gap', 'Gap', 'Model margin minus market margin, home view')}${th('to', 'Total')}${th('mt', 'Model')}${th('tgap', 'Gap')}<th>Best at your books</th>${th('ev', 'EV')}</tr></thead><tbody>
  ${rows.map(r => { const E = r.E; return `<tr class="click" data-game="${E.g.id}"><td>${E.at.abbr} at ${E.ht.abbr}</td><td>${E.started ? 'Started' : fmtDay(E.g.ymd).split(',')[0] + ' ' + fmtTime(E.g.date)}</td>
    <td>${fin(r.sp) ? lineStr(r.sp) : '<span class="muted">--</span>'}</td><td>${lineStr(Math.round(r.mm * 2) / 2)}</td><td class="${fin(r.gap) && Math.abs(r.gap) >= 3 ? 'pos' : ''}">${fin(r.gap) ? sgn(r.gap) : '--'}</td>
    <td>${fin(r.to) ? totStr(r.to) : '<span class="muted">--</span>'}</td><td>${r.mt.toFixed(1)}</td><td>${fin(r.tgap) ? sgn(r.tgap) : '--'}</td>
    <td>${E.top && !E.started ? `${esc(E.top.label)} ${amStr(E.top.best.price)} <span class="muted">${bookShort(E.top.best.book, E.top.best.bookTitle)}</span>` : '<span class="muted">--</span>'}</td>
    <td class="${fin(r.ev) ? (r.ev >= S.settings.minEv && !E.stale ? 'pos' : r.ev < 0 ? 'neg' : '') : ''}">${fin(r.ev) ? sgnPct(r.ev) : '--'}</td></tr>`; }).join('')}
  </tbody></table></div>
  <p class="sub" style="margin-top:10px">Gap uses the pure model. Fair prices use the market plus ${Math.round(S.settings.wSide * 100)}% of the model on sides and ${Math.round(S.settings.wTotal * 100)}% on totals, which is all the backtest supports.</p>`;
}

/* ---------- Game sheet ---------- */
function openSheet(html) { const sh = $('#sheet'); sh.innerHTML = '<div class="grab"></div>' + html; sh.classList.add('open'); $('#scrim').classList.add('open'); sh.scrollTop = 0; const f = sh.querySelector('[data-autofocus]') || sh.querySelector('button'); f && f.focus({ preventScroll: true }); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); S.openGame = null; }
function findGame(id) { for (const k in S.slate) { const g = S.slate[k].games.find(x => x.id === id); if (g) return g; } return null; }
function openGame(id) {
  const g = findGame(id); if (!g) return; S.openGame = id;
  const E = evalGame(g), { ht, at } = E;
  const fmtP = o => o ? pct(o.win, 1) : '--';
  const board = E.rows.map((r, i) => {
    const b = r.best;
    return `<tr><td><div class="side-cell"><span>${esc(r.label)}</span>${b && !E.started ? `<button class="btn small" data-logbet="${i}" aria-label="Log ${esc(r.label)}">Log</button>` : ''}</div></td><td>${b ? `${amStr(b.price)} <span class="book">${esc(bookShort(b.book, b.bookTitle))}</span>` : '<span class="muted">--</span>'}</td>
      <td class="${b ? (b.ev >= S.settings.minEv && !E.stale ? 'pos' : b.ev < 0 ? 'neg' : '') : ''}">${b ? sgnPct(b.ev) : '--'}</td><td>${fmtP(b ? b.o : r.fair)}</td><td>${r.mkt ? pct(r.mkt.win, 1) : '--'}</td><td>${pct(r.model.win, 1)}</td></tr>`;
  }).join('');
  const bookKeys = Object.keys(E.books).sort((a, b) => (S.settings.myBooks.includes(b) - S.settings.myBooks.includes(a)) || a.localeCompare(b));
  const cell = (q, mk, sd) => { const x = quoteFor(q, mk, sd); if (!x) return '<td class="muted">--</td>'; const r = E.rows.find(r => r.market === mk && r.side === sd); const isBest = r && r.best && r.best.book && E.books[r.best.book] === q; return `<td${isBest ? ' class="pos"' : ''}>${mk === 'ml' ? '' : (mk === 'total' ? totStr(x.line) : lineStr(x.line)) + ' '}${amStr(x.price)}</td>`; };
  const booksTbl = bookKeys.length ? `<div class="tbl-wrap"><table><thead><tr><th>Book</th><th>${at.abbr}</th><th>${ht.abbr}</th><th>Over</th><th>Under</th><th>${at.abbr} ML</th><th>${ht.abbr} ML</th></tr></thead><tbody>
    ${bookKeys.map(k => { const q = E.books[k]; const mine = S.settings.myBooks.includes(k); return `<tr><td>${mine ? '<b>' : '<span class="muted">'}${esc(bookName(k, q.title))}${mine ? '</b>' : '</span>'}</td>${cell(q, 'spread', 'away')}${cell(q, 'spread', 'home')}${cell(q, 'total', 'over')}${cell(q, 'total', 'under')}${cell(q, 'ml', 'away')}${cell(q, 'ml', 'home')}</tr>`; }).join('')}
    </tbody></table></div>` : `<p class="sub">No prices for this game yet.</p>`;
  const hRow = E.rows[0], tRow = E.rows[2];
  const ladder = (mk, side, base, center) => { const out = []; for (let x = base - 2; x <= base + 2 + 1e-9; x += 0.5) { const o = outcome(mk, side, x, center); out.push(`<tr><td>${mk === 'total' ? totStr(x) : lineStr(x)}</td><td>${pct(o.win, 1)}</td><td>${o.push ? pct(o.push, 1) : '0%'}</td><td>${amStr(probToAm(condWin(o)))}</td></tr>`); } return out.join(''); };
  const inj = t => { const L = injuriesFor(t.id); return `<h3 style="margin:10px 0 4px">${esc(t.name)}</h3>` + (L.length ? `<ul class="inj">${L.map(x => `<li><span>${esc(x.name)} <span class="muted">${esc(x.pos)}${x.detail ? ', ' + esc(x.detail) : ''}</span></span><span class="st ${injClass(x.status)}">${esc(x.status)}</span></li>`).join('')}</ul>` : '<p class="sub">Nothing listed.</p>'); };
  const adj = S.adj[g.id] || { m: 0, t: 0, note: '' };
  const consTxt = E.source === 'odds' ? `${E.cons.nBooks} books, pulled ${fmtAgo(E.pricedAt)}` : E.source === 'espn' ? `ESPN single line (${esc(E.books.espn.title)})` : 'no prices';
  const hist = S.hist[g.id] || [];
  const move = hist.length > 1 && fin(hist[0].spLine) && fin(hist[hist.length - 1].spLine) ? `Line moved from ${ht.abbr} ${lineStr(hist[0].spLine)} to ${lineStr(hist[hist.length - 1].spLine)} across ${hist.length} pulls.` : '';
  openSheet(`<div class="sheet-head"><div><h2 id="sheetTitle">${esc(at.name)} at ${esc(ht.name)}</h2><div class="sub">${fmtDay(g.ymd)}, ${fmtTime(g.date)}${g.venue ? ', ' + esc(g.venue) : ''}. Prices: ${consTxt}.</div></div><span class="spacer"></span><button class="icon-btn" data-act="close" aria-label="Close" data-autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="section kv">
    <div><span>Model, ${ht.abbr} margin</span><b>${sgn(E.proj.pm)}</b></div>
    <div><span>Market margin</span><b>${fin(E.cons.M) ? sgn(E.cons.M) : '--'}</b></div>
    <div><span>Fair margin</span><b>${sgn(E.fair.M)}</b></div>
    <div><span>Model total</span><b>${E.proj.pt.toFixed(1)}</b></div>
    <div><span>Market total</span><b>${fin(E.cons.T) ? E.cons.T.toFixed(1) : '--'}</b></div>
    <div><span>${ht.abbr} fair win</span><b>${pct(E.winFair, 1)}</b></div>
  </div>
  ${E.flags.length ? `<p class="sub">Read ${E.tier}. ${E.flags.map(f => f.replace(/_/g, ' ')).join(', ')}.</p>` : `<p class="sub">Read ${E.tier}.</p>`}
  <div class="section"><h3 style="margin-bottom:8px">Board</h3>
  <div class="tbl-wrap board"><table><thead><tr><th>Side</th><th>Best price</th><th>EV</th><th title="Win chance under the fair price">Fair</th><th title="Market consensus, no vig, at this line">No vig</th><th title="Pure model at this line">Model</th></tr></thead><tbody>${board}</tbody></table></div>
  <p class="sub" style="margin-top:6px">${E.rows[0].ownBooks ? 'Best price is the highest EV quote across your books.' : 'None of your books has this game, so the best price comes from any book.'} Whole number lines carry a push (about ${(BACKTEST.push.spreadInt * 100).toFixed(1)}% on spreads, ${(BACKTEST.push.totalInt * 100).toFixed(1)}% on totals), which EV accounts for. ${move}</p></div>
  <div class="section"><h3 style="margin-bottom:8px">Every book</h3>${booksTbl}</div>
  <div class="section grid2">
    <div><h3 style="margin-bottom:8px">${ht.abbr} spread ladder</h3><div class="tbl-wrap"><table><thead><tr><th>Line</th><th>Cover</th><th>Push</th><th>Fair price</th></tr></thead><tbody>${ladder('spread', 'home', Math.round((fin(hRow.line) ? hRow.line : -E.fair.M) * 2) / 2, E.fair.M)}</tbody></table></div></div>
    <div><h3 style="margin-bottom:8px">Over ladder</h3><div class="tbl-wrap"><table><thead><tr><th>Total</th><th>Over</th><th>Push</th><th>Fair price</th></tr></thead><tbody>${ladder('total', 'over', Math.round((fin(tRow.line) ? tRow.line : E.fair.T) * 2) / 2, E.fair.T)}</tbody></table></div></div>
  </div>
  <div class="section"><h3>Injury report</h3><p class="sub">From ESPN, ${S.injuries ? 'updated ' + fmtAgo(S.injuries.fetchedAt) : 'not loaded'}. The model cannot see who plays; the market can.</p>${inj(at)}${inj(ht)}</div>
  <div class="section panel"><h3>Your adjustment</h3>
    <p class="sub">Use this when you know something the ratings do not, such as a star ruled out. Points are added to the model before it is blended with the market, so at ${Math.round(S.settings.wSide * 100)}% model weight a 5 point adjustment moves the fair margin ${(5 * S.settings.wSide).toFixed(1)} points. Adjusted games are flagged in exports.</p>
    <div class="grid2"><div class="field"><label for="adjM">Margin, points toward ${ht.abbr}</label><input id="adjM" type="number" step="0.5" value="${adj.m || 0}"></div>
    <div class="field"><label for="adjT">Total, points</label><input id="adjT" type="number" step="0.5" value="${adj.t || 0}"></div></div>
    <div class="field"><label for="adjN">Note</label><input id="adjN" type="text" value="${esc(adj.note || '')}" placeholder="Why, in a few words"></div>
    <div class="row"><button class="btn primary" data-act="saveAdj">Save adjustment</button><button class="btn ghost" data-act="clearAdj">Clear</button></div>
  </div>
  <div class="section"><h3>Ratings</h3><p class="sub">${esc(at.name)}: net ${sgn(E.R.O[at.idx] + E.R.D[at.idx])}, offense ${sgn(E.R.O[at.idx])}, defense ${sgn(E.R.D[at.idx])}, ${E.gpA} games${E.b2ba ? ', second night of a back to back' : ''}.<br>${esc(ht.name)}: net ${sgn(E.R.O[ht.idx] + E.R.D[ht.idx])}, offense ${sgn(E.R.O[ht.idx])}, defense ${sgn(E.R.D[ht.idx])}, ${E.gpH} games${E.b2bh ? ', second night of a back to back' : ''}.<br>Home court ${E.R.hca.toFixed(2)} points${g.neutral ? ' (not applied, neutral site)' : ''}. League average ${E.R.mu.toFixed(1)} points per team.</p></div>`);
}

/* ---------- Ratings ---------- */
function viewRatings() {
  const ymd = today(), R = ratingsFor(ymd), c = S.chain[S.curSeason];
  const q = S.ratingQ.toLowerCase();
  const rows = TEAMS.map(t => ({ t, net: R.O[t.idx] + R.D[t.idx], o: R.O[t.idx], d: R.D[t.idx], start: c.prior.O[t.idx] + c.prior.D[t.idx], rec: teamRecord(t.id), gp: gamesPlayed(t.id, ymd) }))
    .sort((a, b) => b.net - a.net).map((r, i) => ({ ...r, rank: i + 1 }))
    .filter(r => !q || r.t.name.toLowerCase().includes(q) || r.t.abbr.toLowerCase().includes(q));
  return `<div class="row" style="margin-bottom:10px"><div><h2>Ratings</h2><div class="sub">${seasonLabel(S.curSeason)}, as of today. Points per game against an average team on a neutral floor.</div></div></div>
  <div class="stat-row section" style="margin-top:0"><div class="stat"><span>Games in the fit</span><b>${R.games}</b><small>this season</small></div><div class="stat"><span>Home court</span><b>${R.hca.toFixed(2)}</b><small>points</small></div><div class="stat"><span>Points per team</span><b>${R.mu.toFixed(1)}</b><small>league average</small></div><div class="stat"><span>Recency</span><b>${M.HALF}</b><small>day half life</small></div></div>
  <div class="field" style="max-width:320px"><label for="rq">Find a team</label><input id="rq" type="text" value="${esc(S.ratingQ)}" placeholder="Team or abbreviation" autocomplete="off"></div>
  <div class="tbl-wrap"><table><thead><tr><th>Team</th><th>Rank</th><th>Record</th><th>Net</th><th>Offense</th><th>Defense</th><th title="Net rating carried in from last season">Start</th><th>Change</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${esc(r.t.name)}</td><td>${r.rank}</td><td>${r.rec}</td><td class="${r.net > 0 ? 'pos' : 'neg'}">${sgn(r.net)}</td><td>${sgn(r.o)}</td><td>${sgn(r.d)}</td><td class="muted">${sgn(r.start)}</td><td>${sgn(r.net - r.start)}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="sub" style="margin-top:10px">Offense is points scored above average; defense is points held below average. Net is the sum. Margins past 20 count half, so blowouts do not swamp the ratings, and a team on the second night of a back to back is credited ${M.B2B} points for fatigue.</p>`;
}

/* ---------- Season log ---------- */
function computeWF() {
  if (S.wf) return S.wf;
  const c = S.chain[S.curSeason]; let season = S.curSeason, src = c;
  if (!c.pg.length && S.chain[S.curSeason - 1]) { season = S.curSeason - 1; src = S.chain[season]; }
  const wf = walkForward(src.pg, src.prior);
  const raw = Object.fromEntries((S.seasons[season] ? S.seasons[season].games : []).map(g => [g.id, g]));
  const out = { season, n: wf.length, su: 0, aeM: 0, aeT: 0, close: [], buckets: Array.from({ length: 5 }, () => ({ n: 0, p: 0, w: 0 })) };
  for (const r of wf) {
    const g = r.g, m = g.hp - g.ap, t = g.hp + g.ap, pm = r.proj.pm;
    if (Math.sign(pm) === Math.sign(m)) out.su++;
    out.aeM += Math.abs(pm - m); out.aeT += Math.abs(r.proj.pt - t);

      };
      if (r.market !== 'ml') {
        const lad = []; for (let x = line - 2; x <= line + 2 + 1e-9; x += 0.5) { const lo = outcome(r.market, r.side, x, center); lad.push({ line: +x.toFixed(1), prob_win: +lo.win.toFixed(6), prob_push: +lo.push.toFixed(6) }); }
        rec.model.ladder = lad;
      }
      if (b) rec.price = { line: r.market === 'ml' ? null : b.line, american_odds: b.price, opposite_american_odds: fin(b.opp) ? b.opp : null, sportsbook: bookName(b.book, b.bookTitle), captured_at: new Date(E.pricedAt || now()).toISOString() };
      else flags.push('no_price_in_app');
      if (E.stale && b) flags.push('stale_price');
      if (E.source === 'espn') flags.push('single_feed_price');
      records.push(rec);
    }
  }
  const stamp = gen.replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  return {
    contract: 'warroom.import', contract_version: '1.0',
    batch: {
      source_batch_id: `${SOURCE_APP}-${S.curSeason}-${ymd}-${stamp}`, source_app: SOURCE_APP, model_name: 'Hardwood NBA', model_version: VERSION,
      model_config: { model_weight_sides: st.wSide, model_weight_totals: st.wTotal, half_life_days: M.HALF, ridge: M.LAM, carry: M.CARRY, back_to_back_points: M.B2B, sd_margin: M.SD_ATS, sd_total: M.SD_TOT, sd_moneyline: M.SD_ML, my_books: st.myBooks },
      generated_at: gen, record_count: records.length, is_backfill: false,
    },
    records,
  };
}
function validatePayload(p) {
  const errs = [];
  if (!p.records.length) errs.push('No pregame markets on this day.');
  for (const r of p.records) {
    const m = r.model, s = m.prob_win + m.prob_push + m.prob_loss;
    if (Math.abs(s - 1) > 0.001) errs.push(`${r.record_id}: probabilities sum to ${s.toFixed(4)}`);
    if (![m.prob_win, m.prob_push, m.prob_loss].every(x => x >= 0 && x <= 1)) errs.push(`${r.record_id}: probability out of range`);
    if (!r.event.start_time || !r.event.participants.length) errs.push(`${r.record_id}: missing event details`);
    if (r.price && !fin(r.price.american_odds)) errs.push(`${r.record_id}: price without odds`);
  }
  return errs;
}
async function sendToWarRoom() {
  const p = buildPayload(S.day), errs = validatePayload(p);
  if (errs.length) { S.lastSent = 'Not sent. ' + errs.slice(0, 3).join(' '); render(); return; }
  let target; try { target = new URL(S.settings.warRoomUrl); } catch (e) { S.lastSent = 'The War Room address in Settings is not a valid URL.'; render(); return; }
  const win = window.open(target.href, '_blank');
  if (!win) { S.lastSent = 'Your browser blocked the War Room tab. Use Copy JSON or Download JSON instead.'; render(); return; }
  S.lastSent = `Waiting for The War Room to open (${p.records.length} records ready).`; render();
  let sent = false;
  const onMsg = ev => {
    if (ev.origin !== target.origin || !ev.data || typeof ev.data !== 'object') return;
    if (ev.data.type === 'warroom:ready' && !sent) { sent = true; win.postMessage({ type: 'warroom:payload', payload: p }, target.origin); }
    if (ev.data.type === 'warroom:received') { cleanup(); S.lastSent = `Sent ${ev.data.records ?? p.records.length} records. Finish the import in The War Room.`; render(); }
  };
  const cleanup = () => { window.removeEventListener('message', onMsg); clearTimeout(timer); };
  const timer = setTimeout(() => { cleanup(); if (!sent) { S.lastSent = 'The War Room did not answer within 60 seconds. Sign in there, or use Copy JSON or Download JSON.'; render(); } }, 60000);
  window.addEventListener('message', onMsg);
}
async function copyPayload() {
  const p = buildPayload(S.day), errs = validatePayload(p); if (errs.length) return toast(errs[0]);
  const txt = JSON.stringify(p, null, 2);
  try { await navigator.clipboard.writeText(txt); toast(`Copied ${p.records.length} records.`); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(`Copied ${p.records.length} records.`); } catch (x) { toast('Copy failed. Use Download JSON.'); } ta.remove(); }
}
function downloadText(name, txt) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadPayload() {
  const p = buildPayload(S.day), errs = validatePayload(p); if (errs.length) return toast(errs[0]);
  downloadText(`warroom-${SOURCE_APP}-${S.day}-${p.batch.generated_at.replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z')}.json`, JSON.stringify(p, null, 2));
}

/* =====================================================================
   EVENTS AND STARTUP
   ===================================================================== */
async function refreshAll({ force = false, odds = false } = {}) {
  if (refreshAll.running) return; refreshAll.running = true; S.error = '';
  try {
    setBusy('Loading schedule');
    await ensureSeasons(force);
    await ensureSlate(force);
    await ensureInjuries(force);
    computeChain(); render();
    const st = S.settings, games = allSlateGames().filter(g => g.state === 'pre');
    const age = S.odds ? now() - S.odds.t : Infinity;
    if (st.oddsKey && (odds || (games.length && +st.autoOddsMin > 0 && age > st.autoOddsMin * 60e3))) await pullOdds();
    S.evals = {}; settleBets();
  } catch (e) { console.error(e); S.error = 'Refresh failed: ' + e.message; }
  finally { refreshAll.running = false; setBusy(''); render(); }
}
function readSettingsForm() {
  const st = { ...S.settings };
  st.oddsKey = $('#oddsKey').value.trim(); st.regions = $('#regions').value; st.autoOddsMin = +$('#autoOddsMin').value;
  st.myBooks = $$('[data-book]').filter(x => x.checked).map(x => x.dataset.book);
  st.minEv = clamp(parseFloat($('#minEv').value) / 100 || 0, 0, 0.5);
  st.staleHours = clamp(parseFloat($('#staleHours').value) || 3, 0.5, 48);
  st.wSide = clamp((parseFloat($('#wSide').value) || 0) / 100, 0, 1); st.wTotal = clamp((parseFloat($('#wTotal').value) || 0) / 100, 0, 1);
  st.unit = Math.max(1, parseFloat($('#unit').value) || 10); st.slateDays = clamp(parseInt($('#slateDays').value, 10) || 3, 1, 7);
  st.showPreseason = $('#showPreseason').checked; st.warRoomUrl = $('#warRoomUrl').value.trim() || WAR_ROOM_DEFAULT;
  return st;
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button, a, [data-game]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  if (d.tabLink) { ev.preventDefault(); S.tab = d.tabLink; render(); return; }
  if (d.day) { S.day = d.day; S.lastSent = null; render(); return; }
  if (d.sort) { S.mkSort = { k: d.sort, d: S.mkSort.k === d.sort ? -S.mkSort.d : -1 }; render(); return; }
  if (d.betfilter) { S.betFilter = d.betfilter; render(); return; }
  if (d.logbet) { openBetForm(S.openGame, +d.logbet); return; }
  if (d.delbet) { if (confirm('Delete this bet? This cannot be undone.')) { S.bets = S.bets.filter(b => b.id !== d.delbet); await saveBets(); render(); } return; }
  if (d.game && !d.act) { openGame(d.game); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'dismiss': S.error = ''; render(); break;
    case 'backToGame': openGame(S.openGame); break;
    case 'saveBet': await saveBet(d.game, +d.row); break;
    case 'saveAdj': {
      const id = S.openGame, m = parseFloat($('#adjM').value) || 0, tt = parseFloat($('#adjT').value) || 0, note = $('#adjN').value.trim();
      if (m || tt) S.adj[id] = { m, t: tt, note, at: now() }; else delete S.adj[id];
      await DB.set('adj', S.adj); S.evals = {}; toast(m || tt ? 'Adjustment saved.' : 'Adjustment cleared.'); openGame(id); render(); break;
    }
    case 'clearAdj': { const id = S.openGame; delete S.adj[id]; await DB.set('adj', S.adj); S.evals = {}; toast('Adjustment cleared.'); openGame(id); render(); break; }
    case 'sendWR': await sendToWarRoom(); break;
    case 'copyWR': await copyPayload(); break;
    case 'downloadWR': downloadPayload(); break;
    case 'saveSettings': {
      const before = JSON.stringify([S.settings.slateDays, S.settings.showPreseason]);
      S.settings = readSettingsForm(); saveSettings(S.settings); S.evals = {}; toast('Settings saved.');
      if (JSON.stringify([S.settings.slateDays, S.settings.showPreseason]) !== before) await refreshAll({}); else render();
      break;
    }
    case 'resetSettings': if (confirm('Restore default settings? Your Odds API key is kept.')) { S.settings = { ...DEFAULTS, oddsKey: S.settings.oddsKey }; saveSettings(S.settings); S.evals = {}; render(); toast('Defaults restored.'); } break;
    case 'reloadAll': if (confirm('Reload every saved season from ESPN? This makes about 150 requests.')) { for (const k of await DB.keys()) if (k.startsWith('season:') || k.startsWith('slate:')) await DB.del(k); S.seasons = {}; S.slate = {}; S.chain = null; render(); await refreshAll({ force: true }); } break;
    case 'clearPrices': if (confirm('Clear saved prices and price history? Closing line value for open bets will be lost.')) { S.odds = null; S.hist = {}; await DB.del('odds'); await DB.del('hist'); S.evals = {}; render(); } break;
    case 'exportAll': downloadText(`hardwood-backup-${today()}.json`, JSON.stringify({ app: 'hardwood', version: VERSION, exportedAt: new Date().toISOString(), bets: S.bets, adj: S.adj, hist: S.hist }, null, 2)); break;
  }
});
document.addEventListener('change', async ev => {
  if (ev.target.id === 'importFile') {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (j.app !== 'hardwood' || !Array.isArray(j.bets)) throw new Error('not a Hardwood backup');
      const ids = new Set(S.bets.map(b => b.id)); const add = j.bets.filter(b => !ids.has(b.id));
      S.bets = [...S.bets, ...add].sort((a, b) => b.placedAt - a.placedAt); S.adj = { ...j.adj, ...S.adj };
      for (const k in j.hist || {}) if (!S.hist[k]) S.hist[k] = j.hist[k];
      await saveBets(); await DB.set('adj', S.adj); await DB.set('hist', S.hist); settleBets(); S.evals = {};
      toast(`Restored ${add.length} bets.`); render();
    } catch (e) { toast('Could not restore: ' + e.message); }
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'rq') { S.ratingQ = ev.target.value; const pos = ev.target.selectionStart; render(); const el = $('#rq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
$('#scrim').addEventListener('click', closeSheet);
$('#refreshBtn').addEventListener('click', () => refreshAll({ force: true, odds: true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.chain) refreshAll({}); });

(async function init() {
  render();
  await loadCached();
  if (Object.keys(S.seasons).length) { S.curSeason = seasonFor(today()); S.days = Array.from({ length: S.settings.slateDays }, (_, i) => addDays(today(), i)); S.day = S.days[0]; try { computeChain(); settleBets(); } catch (e) { S.chain = null; } render(); }
  await refreshAll({});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
